<style>
  :root{
    --amarillo: #FCE38A;
    --amarillo-fuerte: #FFD65C;
    --lila: #D9C3E8;
    --lila-fuerte: #B98CD6;
    --verde: #9FE0B2;
    --verde-fuerte: #4FC777;
    --terracota: #CE7E67;
    --terracota-fuerte: #A85E49;
    --crema: #FFFBF2;
    --tinta: #2E3B2F;
    --tinta-suave: #5C6B5D;
    --r-xl: 44px;
    --r-lg: 28px;
    --r-md: 18px;
    --sombra: 0 14px 34px rgba(46,59,47,0.10);
    --sombra-suave: 0 6px 18px rgba(46,59,47,0.08);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--crema); color:var(--tinta);
    font-family:'Be Vietnam Pro', sans-serif; font-size:17px; line-height:1.65;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; font-weight:700; line-height:1.12; margin:0; color:var(--tinta); }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .container{ max-width:1180px; margin:0 auto; padding:0 32px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:12.5px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--terracota-fuerte);
    background:rgba(206,126,103,0.12); padding:7px 16px; border-radius:999px; margin-bottom:18px;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Be Vietnam Pro', sans-serif; font-weight:700; font-size:16px;
    padding:16px 30px; border-radius:999px; border:none; cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn:focus-visible{ outline:3px solid var(--tinta); outline-offset:3px; }
  .btn-primary{ background:var(--terracota); color:#fff; box-shadow:0 10px 22px rgba(206,126,103,0.35); }
  .btn-primary:hover{ background:var(--terracota-fuerte); }
  .btn-ghost{ background:transparent; color:var(--tinta); border:2px solid var(--tinta); }
  .btn-ghost:hover{ background:var(--tinta); color:#fff; }
  .btn-small{ padding:11px 22px; font-size:14px; }

  /* HEADER */
  header{
    position:sticky; top:0; z-index:50; background:rgba(255,251,242,0.9);
    backdrop-filter:blur(10px); border-bottom:1px solid rgba(46,59,47,0.07);
  }
  .nav-wrap{ display:flex; align-items:center; justify-content:space-between; padding:14px 32px; max-width:1180px; margin:0 auto; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; color:var(--terracota-fuerte); }
  .logo img{ width:46px; height:46px; }
  nav ul{ list-style:none; display:flex; gap:32px; margin:0; padding:0; }
  nav a{ font-weight:600; font-size:15px; color:var(--tinta); position:relative; padding:4px 0; }
  nav a::after{ content:""; position:absolute; left:0; bottom:-3px; width:0; height:3px; background:var(--verde-fuerte); border-radius:3px; transition:width .2s ease; }
  nav a:hover::after, nav a.active::after{ width:100%; }
  .nav-links{ display:flex; align-items:center; gap:32px; }
  .menu-toggle{ display:none; }
  @media (max-width:860px){ .nav-links ul{ display:none; } }

  section{ padding:100px 0; position:relative; }
  .section-head{ max-width:640px; margin:0 auto 52px; text-align:center; }
  .section-head h2{ font-size:clamp(30px,4vw,42px); }
  .section-head p{ margin-top:16px; color:var(--tinta-suave); font-size:17px; }

</head>
